<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>media · offline</title>
    <!-- Served by public/sw.js when there's no connection and no kept copy of the page. Self-contained: offline, nothing else can load. -->
    <style>
      :root {
        --paper: #f1ede6;
        --ink: #1c1a17;
        --ink-soft: #5b564e;
        --accent: #b4561f;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #121110;
          --ink: #ece7df;
          --ink-soft: #a9a196;
          --accent: #e2a55a;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: var(--paper);
        color: var(--ink);
        font: 1rem/1.6 system-ui, sans-serif;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 500;
                margin: 0 0 12px;
      }
      p {
        color: var(--ink-soft);
        margin: 0 0 20px;
      }
      a {
        color: var(--accent);
        font: 0.85rem ui-monospace, "SF Mono", Menlo, monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection</h1>
      <p>Can’t reach the media server, and this page hasn’t been opened on this device before. Videos stream from the server, so it needs to be running and reachable.</p>
      <a href="/">Back to the library</a>
    </main>
  </body>
</html>
